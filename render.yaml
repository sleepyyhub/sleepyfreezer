services:
  - type: web
    name: clovyre
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/config
    autoDeploy: true
    envVars:
      # Set in the Render dashboard — never committed to the repo.
      - key: TOKENROUTER_API_KEY
        sync: false
      - key: TOKENROUTER_BASE_URL
        value: https://api.tokenrouter.com/v1
      - key: CLOVYRE_MODEL
        value: moonshotai/kimi-k3-free
      - key: NODE_VERSION
        value: "22"
