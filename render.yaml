# Render blueprint for Clovyre MCP.
#
# A single web service holds the Next.js dashboard, the session API, the remote
# MCP endpoint and the Roblox WebSocket gateway in one Node process. Long-lived
# upgrade connections rule out serverless targets, and the in-memory session
# store rules out running more than one instance.
services:
  - type: web
    name: clovyre-mcp
    runtime: node
    # The live deployment runs on the free instance type. Free instances spin
    # down after ~15 minutes without traffic, but sessions survive that: they
    # are written through to Postgres and reloaded at boot. Move to a paid
    # instance type if you need the gateway to stay warm.
    plan: free
    region: oregon
    branch: claude/clovyre-mcp-full-stack-b3nw61
    autoDeploy: true
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      # Generated by Render and never committed. These must stay stable for the
      # life of the deployment: TOKEN_HASH_SECRET keys the credential digests,
      # so rotating it invalidates every persisted session's tokens.
      - key: SESSION_SECRET
        generateValue: true
      - key: TOKEN_HASH_SECRET
        generateValue: true
      # Sessions persist and end only when terminated.
      - key: SESSION_TTL_MINUTES
        value: '0'
      # Durable session storage. Without it sessions die with the process.
      - key: DATABASE_URL
        fromDatabase:
          name: clovyre-db
          property: connectionString
      - key: PRIVILEGE_TTL_MINUTES
        value: '15'
      - key: MAX_WS_PAYLOAD_BYTES
        value: '524288'
      - key: MAX_COMMAND_TIMEOUT_MS
        value: '30000'
      - key: MAX_SCRIPT_SOURCE_BYTES
        value: '262144'
      - key: ENABLE_EXECUTE_LUAU_FEATURE
        value: 'true'
      - key: ENABLE_MUTATION_TOOLS_FEATURE
        value: 'true'
      - key: MAX_SESSIONS
        value: '500'
      # PUBLIC_BASE_URL is set to the service URL after the first deploy so the
      # generated loadstring and MCP endpoint use the canonical origin.

databases:
  - name: clovyre-db
    plan: free
    region: oregon
    postgresMajorVersion: '18'
